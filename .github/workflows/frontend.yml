name: Frontend checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check for frontend package
        id: package
        run: test -f package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.package.outputs.present == 'true'
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        if: steps.package.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: steps.package.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.package.outputs.present == 'true'
        run: pnpm run format:check && pnpm run lint && pnpm run typecheck && pnpm run build
