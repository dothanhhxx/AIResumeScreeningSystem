[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "ai-resume-screening"
version = "0.1.0"
description = "AI-powered Resume Screening System"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ───────────────────────────
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",

    # ── Database ────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.25,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.0,<2.0",

    # ── Config / Validation ─────────────────────
    "pydantic>=2.5.0,<3.0",
    "pydantic-settings>=2.1.0,<3.0",

    # ── Auth ────────────────────────────────────
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "python-multipart>=0.0.6",

    # ── Storage (S3/MinIO) ──────────────────────
    "boto3>=1.34.0,<2.0",

    # ── Redis ───────────────────────────────────
    "redis>=5.0.0,<6.0",

    # ── Celery (async tasks) ────────────────────
    "celery[redis]>=5.3.0,<6.0",

    # ── Utilities ───────────────────────────────
    "httpx>=0.26.0,<1.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
